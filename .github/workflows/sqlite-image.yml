  contents: read

jobs:
  sqlite-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and verify SQLite runtime stage
        run: tests/test_sqlite_image.sh
